[project]
name = "otp-pipeline"
version = "0.1.0"
description = "Reproducible data preparation for Ocean Turning Points"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "netCDF4>=1.7",
  "xarray>=2024.6",
  "scipy>=1.13",
  "pillow>=10.4",
  "matplotlib>=3.9",
  "cmocean>=4.0",
  "remotezip>=0.12",
  "rasterio>=1.3",
  "rdata>=1.1.0",
  "pyogrio>=0.13.0",
  "shapely>=2.2.0",
]
