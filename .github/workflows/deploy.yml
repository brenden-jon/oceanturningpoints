# Builds the static site and publishes it to GitHub Pages on every push to
# main, every morning (to refresh "The ocean now"), or by hand
# (Actions -> Deploy -> Run workflow).
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 06:40 UTC: after NOAA's overnight updates of currents, SST and sea ice.
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
      - name: Refresh "The ocean now" data
        # Currents, SST anomaly, coral heat stress, sea ice, world SST, El Niño indices and
        # Global Fishing Watch effort (needs the GFW_TOKEN repository secret).
        # If a source is down or the secret is missing, the committed snapshot is used instead.
        working-directory: pipeline
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: uv run python ocean_now.py
        continue-on-error: true
      - name: Refresh reef heat-stress history and observing platforms (Mondays)
        # About 280 MB from NOAA Coral Reef Watch, so weekly rather than daily.
        if: github.event_name == 'schedule' && github.event.schedule == '40 6 * * *'
        working-directory: pipeline
        run: |
          if [ "$(date -u +%u)" = "1" ]; then uv run python reef_stations.py; fi
          if [ "$(date -u +%u)" = "1" ]; then uv run python monitoring.py || echo "OceanOPS harvest failed; keeping last week's platforms"; fi
        continue-on-error: true
      - run: npm run build
        env:
          # Empty for a custom domain; "/<repo>" for a project page
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Full public address, used for canonical links and share images
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
          NEXT_PUBLIC_CF_BEACON: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
